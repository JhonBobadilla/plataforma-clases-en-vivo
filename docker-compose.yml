version: '3'
services:
  postgres:
    image: postgres:15
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: w858504042828
      POSTGRES_DB: plataforma_clases
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: w858504042828
      DB_NAME: plataforma_clases
      LIVEKIT_API_KEY: livekit123
      LIVEKIT_API_SECRET: livekit123
      LIVEKIT_URL: ws://livekit:7880
    depends_on:
      - postgres
      - livekit

  frontend:
    build: ./frontend
    container_name: frontend
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://backend:3000
      REACT_APP_LIVEKIT_URL: ws://livekit:7880
    stdin_open: true
    tty: true
    depends_on:
      - backend

  livekit:
    image: livekit/livekit-server
    container_name: livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881"
    environment:
      LIVEKIT_KEYS: "livekit123: livekit123"
      LIVEKIT_RECORDING_DIR: /var/livekit/recordings
      RTC_VIDEO_MAX_BITRATE: 5000000
      RTC_VIDEO_WIDTH: 1920
      RTC_VIDEO_HEIGHT: 1080
      RTC_VIDEO_FRAME_RATE: 30
      RTC_VIDEO_MAX_QUALITY: high
    volumes:
      - ./recordings:/var/livekit/recordings

volumes:
  pgdata:
